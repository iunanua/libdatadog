name: Release - Open a release PR
on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to release
        required: true
        type: choice
        options:
          - libdd-common
          - libdd-telemetry
          - libdd-ddsketch
          - libdd-library-config
          - libdd-crashtracker
          - libdd-data-pipeline
          - libdd-trace-protobuf
          - libdd-trace-normalization
          - libdd-trace-utils
          - libdd-dogstatsd-client
          - libdd-tinybytes
          - libdd-log
      version:
        description: Version to release
        required: true
        type: string

jobs:
  make-release-pr:
    permissions:
      id-token: write # Enable OIDC
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    # TODO: uncomment this when we have a way to test this workflow
    # if: ${{ github.repository_owner == 'datadog' }}
    steps:
      - name: Display release information
        run: |
          echo "### Release Information :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Crate:** \`${{ inputs.crate }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Creating release PR..." >> $GITHUB_STEP_SUMMARY
      
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
      - uses: chainguard-dev/actions/setup-gitsign@0cda751b114eb55c388e88f7479292668165602a # v1.0.2
      
      - name: Run release-plz
        uses: release-plz/action@487eb7b5c085a664d5c5ca05f4159bd9b591182a # v0.5.120
        with:
          command: release-pr
          dry_run: true
          # manifest_path: "${{ inputs.crate }}/Cargo.toml"
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
