[workspace]
allow_dirty = true # allow updating repositories with uncommitted changes
changelog_update = true # disable changelog updates
dependencies_update = false # update dependencies with `cargo update`
git_release_enable = false # disable GitHub/Gitea releases
pr_branch_prefix = "release-" # PR branch prefix
pr_labels = ["release"] # add the `release` label to the release Pull Request
publish_allow_dirty = true # add `--allow-dirty` to `cargo publish`
semver_check = true # disable API breaking changes checks
publish_timeout = "10m" # set a timeout for `cargo publish`
release_commits = "^feat:" # prepare release only if at least one commit matches a regex
publish_all_features = true
publish = true

[[package]]
name = "libdd-data-pipeline"

[[package]]
name = "libdd-common"

[changelog]
protect_breaking_commits = false # always include commits with breaking changes in the changelog